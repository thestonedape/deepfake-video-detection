services:
  - type: web
    name: deepfake-detector-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/supervise.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FRONTEND_ORIGINS
        value: https://deepfake-ten-psi.vercel.app
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: INFERENCE_BATCH_SIZE
        value: "1"
