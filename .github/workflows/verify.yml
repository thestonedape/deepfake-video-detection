name: Async service verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: deepfake_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d deepfake_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deepfake_test
      SDE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deepfake_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests -q
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
      - run: docker build -t deepfake:${{ github.sha }} .
      - name: Deploy verified revision
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"; else echo 'No deployment hook configured; deployment not triggered.'; fi
