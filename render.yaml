services:
  - type: web
    name: deepfake-detector-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FRONTEND_ORIGINS
        value: https://deepfake-ten-psi.vercel.app
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: INFERENCE_BATCH_SIZE
        value: "1"
