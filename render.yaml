services:
  - type: web
    name: deepfake-detector-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        value: https://deepfake-ten-psi.vercel.app
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: INFERENCE_BATCH_SIZE
        value: "1"
